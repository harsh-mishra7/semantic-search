# Phase 4 evaluation set.
#
# HOW THESE WERE WRITTEN, and why it matters:
#
# By reading the documents and asking "what would someone search for to find
# this?" -- NOT by running the system and recording what it returned. The second
# method produces an eval set that always scores well and can never tell you
# you have regressed, because it measures the system against itself.
#
# `expected_sources` was then verified by grep: every listed path really does
# contain the answer, and paths were NOT listed just because they seemed likely.
# Where several documents genuinely answer a question (this corpus has five
# overlapping deployment guides) all of them are listed -- marking a correct
# retrieval as wrong is just as damaging to the metric as the reverse.
#
# Paths match Chunk.doc_path: relative to data/, so they start with quick-clinic/.
#
# 25 questions, covering all 17 documents.

